services:
  - name: ledger-stock
    type: web
    runtime: python
    plan: free
    # preDeployCommand seria o lugar ideal pra rodar a migração (roda
    # depois do build, antes do start), mas esse campo só existe nos
    # planos pagos do Render - no tier gratuito, o migrate entra junto
    # no buildCommand mesmo.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_superuser_if_none_exists"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      # Gerada automaticamente pelo Render (valor aleatório de 256 bits) -
      # nunca precisa ser digitada manualmente.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # sync: false = preenchido manualmente no painel do Render depois
      # que o serviço for criado, nunca fica guardado neste arquivo nem
      # no git. ALLOWED_HOSTS só dá pra saber depois que o Render atribui
      # o domínio (ex.: ledger-stock.onrender.com); as credenciais do
      # Postgres de produção (Neon) são intencionalmente mantidas fora de
      # qualquer arquivo desde a decisão original de infraestrutura.
      - key: ALLOWED_HOSTS
        sync: false
      # Usadas só pelo create_superuser_if_none_exists no primeiro
      # deploy - o comando não faz nada se já existir um superusuário,
      # então é seguro deixar configuradas mesmo depois. Dá pra apagar
      # o valor de DJANGO_SUPERUSER_PASSWORD no painel do Render assim
      # que confirmar que o login funciona, se preferir não deixar essa
      # senha em texto puro salva lá indefinidamente.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
