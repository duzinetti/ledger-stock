{% extends 'inventory/base.html' %}

{% block title %}Reativar {{ product.name }} · LedgerStock{% endblock %}

{% block content %}
    <div class="col-12 col-md-6 mx-auto">
        <h2 class="mb-3">Reativar produto</h2>
        <p class="text-muted">Tem certeza que deseja reativar <strong>{{ product.name }}</strong>? Ele voltará a aparecer na listagem de produtos.</p>

        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-success">Confirmar reativação</button>
            <a href="{% url 'product_inactive_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
