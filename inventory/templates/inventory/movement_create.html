{% extends 'inventory/base.html' %}

{% block content %}
    <h2>Registrar movimentação - {{ product.name }}</h2>
    <p>Quantidade atual: {{ product.current_quantity }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrar</button>
    </form>
{% endblock %}
