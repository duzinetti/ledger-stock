{% extends 'inventory/base.html' %}

{% block content %}
    <div class="col-12 col-md-6 mx-auto">
        <h2 class="mb-3">Redefinir senha</h2>
        <p class="text-muted">Isso vai gerar uma nova senha temporária para <strong>{{ membership.user.username }}</strong> e invalidar a senha atual dele imediatamente. Tem certeza?</p>

        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar redefinição</button>
            <a href="{% url 'employee_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
