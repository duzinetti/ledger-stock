{% extends 'inventory/base.html' %}

{% block content %}
    <h2>Inativar produto</h2>
    <p>Tem certeza que deseja inativar <strong>{{ product.name }}</strong>? O produto deixará de aparecer na listagem, mas seu histórico de movimentações permanece preservado.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar inativação</button>
        <a href="{% url 'product_detail' product.id %}">Cancelar</a>
    </form>
{% endblock %}
