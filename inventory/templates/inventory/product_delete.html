{% extends 'inventory/base.html' %}

{% block content %}
    <h2>Excluir produto</h2>
    <p>Tem certeza que deseja excluir <strong>{{ product.name }}</strong>? Todo o histórico de movimentações desse produto também será apagado.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
        <a href="{% url 'product_detail' product.id %}">Cancelar</a>
    </form>
{% endblock %}
