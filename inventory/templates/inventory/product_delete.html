{% extends 'inventory/base.html' %}

{% block content %}
    <div class="col-12 col-md-6">
        <h2 class="mb-3">Inativar produto</h2>
        <p class="text-muted">Tem certeza que deseja inativar <strong>{{ product.name }}</strong>? O produto deixará de aparecer na listagem, mas seu histórico de movimentações permanece preservado.</p>

        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar inativação</button>
            <a href="{% url 'product_detail' product.id %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
