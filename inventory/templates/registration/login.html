{% extends 'inventory/base.html' %}

{% block title %}Entrar · LedgerStock{% endblock %}

{% block content %}
    <div class="col-12 col-md-5 mx-auto mt-4">
        <div class="text-center mb-4">
            <svg width="40" height="40" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="mb-2">
                <rect width="24" height="24" rx="7" fill="#5e6ad2"/>
                <path d="M12 5l6 3.2v7.6L12 19l-6-3.2V8.2L12 5z" fill="none" stroke="#f2f3f5" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M12 5v6.5M12 11.5l6-3.2M12 11.5l-6-3.2" stroke="#f2f3f5" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
            </svg>
            <h2 class="mb-0">Entrar</h2>
        </div>

        <div class="card">
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger d-flex align-items-center gap-2">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="flex-shrink-0">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <div>Usuário ou senha inválidos.</div>
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
