{% extends 'inventory/base.html' %}

{% block content %}
    <h2>Editar produto</h2>
    <form method="post">
        {% csrf_token %}
        <p>
            <label>Nome</label><br>
            <input type="text" name="nome" value="{{ product.name }}" required>
        </p>
        <p>
            <label>Categoria</label><br>
            <input type="text" name="categoria" value="{{ product.category }}">
        </p>
        <p>
            <label>Preço</label><br>
            <input type="number" step="0.01" name="preco" value="{{ product.price }}" required>
        </p>
        <p>
            <label>Quantidade mínima</label><br>
            <input type="number" name="quantidade_minima" value="{{ product.minimum_quantity }}">
        </p>
        <button type="submit">Salvar</button>
    </form>
{% endblock %}
